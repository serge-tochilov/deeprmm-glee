[project]
name = "nommd-arena"
version = "0.1.0"
description = "Dynamic recursive mental-modeling games with persistent NoMMD state"
requires-python = ">=3.12"
dependencies = [
    "glee-sdk>=0.0.5",
    "polars>=1.43.2",
    "pydantic>=2.7",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nommd_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
